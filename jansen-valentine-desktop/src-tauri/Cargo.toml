[package]
name = "jansen-valentine"
version = "1.0.0"
description = "JANSEN VALENTINE — Boutique Management System"
authors = ["Astraz Studio"]
license = "Proprietary"
edition = "2021"
rust-version = "1.77"

[lib]
name = "jansen_valentine_lib"
crate-type = ["cdylib", "staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
